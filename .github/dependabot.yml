---
version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "daily"
  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "daily"
  - package-ecosystem: "npm"
    directory: "/"
    open-pull-requests-limit: 20
    schedule:
      interval: "weekly"
    ignore:
      # TS 7 blocked: typescript-eslint (<6.1) and ts-jest (<7) lack TS 7 support; revisit after TS 7.1 (typescript-eslint#10940, ts-jest#5366)
      - dependency-name: "typescript"
        versions: [">=7"]
    groups:
      date-fns:
        patterns:
          - "date-fns"
          - "date-fns-tz"
      eslint:
        patterns:
          - "@eslint-community/*"
          - "@eslint/*"
          - "eslint"
          - "eslint-*"
          - "globals"
          - "typescript-eslint"
      jest:
        patterns:
          - "@types/jest"
          - "jest"
          - "ts-jest"
      libsodium-wrappers:
        patterns:
          - "@types/libsodium-wrappers"
          - "libsodium-wrappers"
      pg:
        patterns:
          - "@types/pg"
          - "postgres-migrations"
          - "pg"
      prettier:
        patterns:
          - "prettier"
      protobuf:
        patterns:
          - "protobufjs"
          - "protobufjs-cli"
      tsconfig:
        patterns:
          - "@tsconfig/*"
