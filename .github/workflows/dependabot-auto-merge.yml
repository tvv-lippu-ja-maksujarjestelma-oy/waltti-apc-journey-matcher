name: Dependency policy
on:
  pull_request_target:
    types:
      [
        opened,
        synchronize,
        reopened,
        edited,
        labeled,
        unlabeled,
        ready_for_review,
        converted_to_draft,
      ]
  # Reviews run an unprivileged signal workflow; only default-branch code below
  # consumes workflow_run. No artifacts or code from the signal are trusted.
  workflow_run:
    workflows: [Dependency review signal]
    types: [completed]
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:
permissions:
  checks: read
  contents: read
  pull-requests: read
  statuses: write
concurrency:
  group: dependency-policy
  cancel-in-progress: false
jobs:
  evaluate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8
        with:
          script: |
            await require('./.github/dependency-policy/run.cjs')({github, context, core});
